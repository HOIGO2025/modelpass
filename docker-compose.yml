# One service. Not a stack.
#
# The only thing that matters in this file is the volumes block: data/ and
# db/ are bind mounts to the host, so rebuilding or deleting the container
# cannot touch the archive. Never replace these with named volumes, and never
# run `docker compose down -v` against this project.
services:
  modelpass:
    build:
      context: .
      args:
        # Must match the host user that owns ./data and ./db, or the container
        # cannot write its own archives. `id -u` / `id -g` on the host.
        # Deliberately not named UID/GID: the shell scripts source .env, and
        # UID is readonly in bash -- assigning it aborts them under `set -e`.
        UID: "${MODELPASS_UID:-1000}"
        GID: "${MODELPASS_GID:-1000}"
    image: modelpass:latest
    container_name: modelpass
    restart: unless-stopped
    env_file: .env
    environment:
      RUN_AT_UTC: "03:00"
      TOP: "1000"
      # The host's db/ is mounted at /app/state, NOT /app/db: mounting over
      # /app/db would hide db/schema.sql that ships in the image, and the
      # collector could not create its tables.
      MODELPASS_DB: /app/state/modelpass.db
    volumes:
      - ./data:/app/data      # archives + daily summaries  <- irreplaceable
      - ./db:/app/state       # database (rebuildable from data/raw)
      - ./logs:/app/logs      # run logs and failure markers
      # The control panel is generated into the repo and served by GitHub
      # Pages, so it must land on the host, not in the container's layer.
      - ./docs:/app/docs
      # Off-site backup over ssh needs a key. Read-only, and only if you use
      # BACKUP_HOST rather than R2.
      # - ~/.ssh:/root/.ssh:ro
